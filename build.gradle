plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = '1.0.0'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.14.0'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.91.0+1.21.11'
    include 'com.mojang:patchy:1.1.0'
    include 'net.fabricmc:intermediary:1.0.0+build.1'
}

loom {
    accessWidenerPath = project.file('src/main/resources/lifesystemmod.accesswidener').toString()
    refreshVersions = false
    refreshDeps = false
    ide {
        runDir = project.file('run')
    }
}
